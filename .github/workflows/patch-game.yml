name: Game Patch Release

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Game APK source."
        required: true
        default: "apkpure"
        type: choice
        options:
          - apkpure
          - manual_xapk
          - google_play
      xapk_url:
        description: "Direct .xapk URL, for manual_xapk source. Leave empty for apkpure."
        required: false
        type: string
      game_version:
        description: "Game version. Required for manual_xapk; optional override for google_play."
        required: false
        type: string
      force:
        description: "Create or replace the release even when the tag already exists."
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the generated game patch release as prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GAME_ID: "com.bandainamcoent.idolmaster_gakuen"
  APKEEP_URL: "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu"
  APKEDITOR_URL: "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"
  LSPATCH_EMBED_URL: "https://raw.githubusercontent.com/Kajaqq/gaku-patcher/f69ed461e16e1095e9d02ddf09dade73752fbd9a/lspatch_embed.jar"
  LSPATCH_EMBED_SHA256: "81235ad19c5829b338ded6a59fdc6fa01d567b72cda32a4cf6c6fd373f0b372e"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      game_version: ${{ steps.plan.outputs.game_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      game_apk_name: ${{ steps.plan.outputs.game_apk_name }}
      patched_apk_name: ${{ steps.plan.outputs.patched_apk_name }}
      source: ${{ steps.plan.outputs.source }}
      xapk_url: ${{ steps.plan.outputs.xapk_url }}
      version_known: ${{ steps.plan.outputs.version_known }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Plan patch release
        id: plan
        env:
          INPUT_GAME_VERSION: ${{ inputs.game_version }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_XAPK_URL: ${{ inputs.xapk_url }}
          INPUT_FORCE: ${{ inputs.force }}
          HAS_PLAY_EMAIL: ${{ secrets.PLAY_EMAIL != '' }}
          HAS_AAS_TOKEN: ${{ secrets.AAS_TOKEN != '' }}
        run: |
          set -euo pipefail
          source="${INPUT_SOURCE:-apkpure}"
          if [ "$source" != "google_play" ] && [ "$source" != "manual_xapk" ] && [ "$source" != "apkpure" ]; then
            echo "Unsupported source: $source"
            exit 1
          fi

          if [ "$source" = "google_play" ] && { [ "$HAS_PLAY_EMAIL" != "true" ] || [ "$HAS_AAS_TOKEN" != "true" ]; }; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "Google Play secrets are missing; skipping scheduled game patch run."
              {
                echo "should_build=false"
                echo "game_version=unknown"
                echo "release_tag=none"
                echo "game_apk_name=none"
                echo "patched_apk_name=none"
                echo "source=$source"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          xapk_url="${INPUT_XAPK_URL:-}"
          version_known=true
          if [ "$source" = "apkpure" ]; then
            if apkpure_info="$(python .github/scripts/apkpure_latest.py --package "$GAME_ID")"; then
              game_version="$(printf '%s' "$apkpure_info" | python -c "import json,sys; print(json.load(sys.stdin)['version'])")"
              xapk_url="$(printf '%s' "$apkpure_info" | python -c "import json,sys; print(json.load(sys.stdin)['xapk_url'])")"
            else
              echo "::warning::Could not probe APKPure version before download; build job will read the XAPK manifest."
              game_version="latest"
              xapk_url="https://d.apkpure.com/b/XAPK/${GAME_ID}?version=latest"
              version_known=false
            fi
          elif [ "$source" = "manual_xapk" ]; then
            test -n "${INPUT_XAPK_URL:-}" || { echo "xapk_url is required for manual_xapk"; exit 1; }
            test -n "${INPUT_GAME_VERSION:-}" || { echo "game_version is required for manual_xapk"; exit 1; }
            game_version="$INPUT_GAME_VERSION"
            xapk_url="$INPUT_XAPK_URL"
          else
            game_version="$(python .github/scripts/google_play_version.py --package "$GAME_ID")"
            if [ -n "${INPUT_GAME_VERSION:-}" ]; then
              game_version="$INPUT_GAME_VERSION"
            fi
          fi

          release_tag="game-v${game_version}"
          game_apk_name="Gakumas_${game_version}_clean.apk"
          patched_apk_name="Gakumas_${game_version}_Localify_Embedded.apk"

          should_build=true
          if [ "$version_known" = "true" ] && git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null && [ "${INPUT_FORCE:-false}" != "true" ]; then
            should_build=false
          fi

          {
            echo "should_build=$should_build"
            echo "game_version=$game_version"
            echo "release_tag=$release_tag"
            echo "game_apk_name=$game_apk_name"
            echo "patched_apk_name=$patched_apk_name"
            echo "source=$source"
            echo "xapk_url=$xapk_url"
            echo "version_known=$version_known"
          } >> "$GITHUB_OUTPUT"

          echo "Source: $source"
          echo "Detected game version: $game_version"
          echo "Release tag: $release_tag"
          echo "Should build: $should_build"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'

    env:
      GAME_VERSION: ${{ needs.check.outputs.game_version }}
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      GAME_APK_NAME: ${{ needs.check.outputs.game_apk_name }}
      PATCHED_APK_NAME: ${{ needs.check.outputs.patched_apk_name }}
      LOCALIFY_MODULE_APK: "GakumasLocalify_module.apk"
      PATCH_MODE: "lspatch-embedded"
      SOURCE: ${{ needs.check.outputs.source }}
      XAPK_URL: ${{ needs.check.outputs.xapk_url }}
      VERSION_KNOWN: ${{ needs.check.outputs.version_known }}
      FORCE: ${{ inputs.force || false }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      AAS_TOKEN: ${{ secrets.AAS_TOKEN }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare Android signing tools
        run: |
          set -eux
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/13.0/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Check required secrets
        if: ${{ env.SOURCE == 'google_play' }}
        run: |
          set -euo pipefail
          test -n "${PLAY_EMAIL:-}" || { echo "PLAY_EMAIL secret is required"; exit 1; }
          test -n "${AAS_TOKEN:-}" || { echo "AAS_TOKEN secret is required"; exit 1; }

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 unzip

      - name: Download patch tools
        run: |
          set -euo pipefail
          aria2c -x4 "$APKEDITOR_URL" -o APKEditor.jar
          aria2c -x4 "$LSPATCH_EMBED_URL" -o LSPatchEmbed.jar
          printf '%s  %s\n' "$LSPATCH_EMBED_SHA256" LSPatchEmbed.jar | sha256sum -c -
          if [ "$SOURCE" = "google_play" ]; then
            aria2c -x4 "$APKEEP_URL" -o apkeep
            chmod +x apkeep
          fi

      - name: Download Localify module APK
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          localify_url="$(python .github/scripts/latest_app_asset.py --repository "$GITHUB_REPOSITORY")"
          echo "Localify module: $localify_url"
          aria2c -x4 "$localify_url" -o "$LOCALIFY_MODULE_APK"
          unzip -t "$LOCALIFY_MODULE_APK" >/dev/null
          python - "$LOCALIFY_MODULE_APK" <<'PY'
          import os
          import sys
          import zipfile

          apk_path = sys.argv[1]
          stripped_path = f"{apk_path}.stripped"
          removed = 0
          with zipfile.ZipFile(apk_path, "r") as source, zipfile.ZipFile(stripped_path, "w") as target:
              for entry in source.infolist():
                  if entry.filename.startswith("assets/gakumas-local/"):
                      removed += 1
                      continue
                  target.writestr(entry, source.read(entry.filename))
          os.replace(stripped_path, apk_path)
          print(f"Removed built-in translation asset entries from Localify module: {removed}")
          PY
          unzip -t "$LOCALIFY_MODULE_APK" >/dev/null

      - name: Download Google Play split APKs
        if: ${{ env.SOURCE == 'google_play' }}
        run: |
          set -euo pipefail
          ./apkeep \
            -a "$GAME_ID" \
            -d google-play \
            -o "locale=jp,timezone=UTC+9,split_apk=1,include_additional_files=true" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            .
          find "$GAME_ID" -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Download XAPK
        if: ${{ env.SOURCE == 'manual_xapk' || env.SOURCE == 'apkpure' }}
        run: |
          set -euo pipefail
          test -n "${XAPK_URL:-}" || { echo "XAPK_URL is required"; exit 1; }
          rm -rf "$GAME_ID" xapk_unpack source.xapk
          aria2c -x4 "$XAPK_URL" -o source.xapk
          unzip -q source.xapk -d xapk_unpack
          expected_version="$GAME_VERSION"
          if [ "$VERSION_KNOWN" != "true" ]; then
            expected_version=""
          fi
          summary="$(python .github/scripts/prepare_xapk.py \
            --root xapk_unpack \
            --package "$GAME_ID" \
            --version "$expected_version" \
            --output "$GAME_ID")"
          printf '%s\n' "$summary"
          actual_version="$(printf '%s' "$summary" | python -c "import json,sys; print(json.load(sys.stdin).get('version_name') or '')")"
          if [ -n "$actual_version" ] && [ "$actual_version" != "$GAME_VERSION" ]; then
            {
              echo "GAME_VERSION=$actual_version"
              echo "RELEASE_TAG=game-v${actual_version}"
              echo "GAME_APK_NAME=Gakumas_${actual_version}_clean.apk"
              echo "PATCHED_APK_NAME=Gakumas_${actual_version}_Localify_Embedded.apk"
            } >> "$GITHUB_ENV"
          fi
          if git rev-parse -q --verify "refs/tags/game-v${actual_version:-$GAME_VERSION}" >/dev/null && [ "$FORCE" != "true" ]; then
            echo "Game release already exists; skipping patch build."
            echo "SHOULD_RELEASE=false" >> "$GITHUB_ENV"
          else
            echo "SHOULD_RELEASE=true" >> "$GITHUB_ENV"
          fi
          find "$GAME_ID" -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Merge split APKs
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        run: |
          set -euo pipefail
          java -jar APKEditor.jar m -i "$GAME_ID" -o "$GAME_APK_NAME"
          unzip -t "$GAME_APK_NAME" >/dev/null

      - name: Patch merged APK
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        run: |
          set -euo pipefail
          rm -rf ls_patched
          set +e
          # Keep LSPatch's built-in signer so game patch releases remain install-compatible.
          java -jar LSPatchEmbed.jar "$GAME_APK_NAME" -m "$LOCALIFY_MODULE_APK" -o ls_patched --force
          lspatch_rc=$?
          set -e
          patched="$(find ls_patched -type f -name '*.apk' -print -quit || true)"
          if [ -z "$patched" ]; then
            echo "LSPatch did not produce an APK. Exit code: $lspatch_rc"
            exit "$lspatch_rc"
          fi
          if [ "$lspatch_rc" -ne 0 ]; then
            echo "::warning::LSPatch exited with $lspatch_rc but produced $patched; continuing."
          fi
          mv "$patched" "$PATCHED_APK_NAME"
          ls -lh "$PATCHED_APK_NAME"
          python - "$PATCHED_APK_NAME" <<'PY'
          import sys, zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              missing = [name for name in ("AndroidManifest.xml", "classes.dex") if name not in names]
              if missing:
                  raise SystemExit(f"Patched APK missing required entries: {', '.join(missing)}")
              print(f"Patched APK zip entries: {len(names)}")
          PY

      - name: Verify patched game APK
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        run: |
          set -euo pipefail
          apksigner verify --verbose --print-certs "$PATCHED_APK_NAME"
          clean_size="$(stat -c%s "$GAME_APK_NAME")"
          patched_size="$(stat -c%s "$PATCHED_APK_NAME")"
          max_expected_size=$((clean_size + 64 * 1024 * 1024))
          if [ "$patched_size" -gt "$max_expected_size" ]; then
            echo "Patched APK grew unexpectedly: clean=$clean_size patched=$patched_size"
            echo "Refusing to publish a likely-expanded LSPatch APK."
            exit 1
          fi

      - name: Write metadata
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        run: |
          set -euo pipefail
          # Game patch compatibility follows the embedded module version, not app-only release bumps.
          module_version_code="$(python - <<'PY'
          import pathlib
          import re

          text = pathlib.Path("app/build.gradle").read_text(encoding="utf-8")
          match = re.search(r'buildConfigField\s+"long",\s+"MODULE_VERSION_CODE",\s+"(\d+)L?"', text)
          if match:
              print(match.group(1))
              raise SystemExit
          match = re.search(r"^\s*versionCode\s+(\d+)\s*$", text, re.MULTILINE)
          if not match:
              raise SystemExit("Could not read module or app versionCode from app/build.gradle")
          print(match.group(1))
          PY
          )"
          python .github/scripts/write_patch_metadata.py \
            --game-package "$GAME_ID" \
            --game-version "$GAME_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --asset "$PATCHED_APK_NAME" \
            --minimum-app-version-code "$module_version_code" \
            --source "$SOURCE" \
            --patch-mode "$PATCH_MODE" \
            --output gkms-game-patch.json
          cat gkms-game-patch.json

      - name: Upload workflow artifact
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        uses: actions/upload-artifact@v6
        with:
          name: Gakumas-Patched-Game-${{ env.GAME_VERSION }}
          path: |
            ${{ env.PATCHED_APK_NAME }}
            gkms-game-patch.json

      - name: Delete existing forced release
        if: ${{ inputs.force && env.SHOULD_RELEASE != 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true

      - name: Create game patch release
        if: ${{ env.SHOULD_RELEASE != 'false' }}
        uses: softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gakumas patched game ${{ env.GAME_VERSION }}
          body: |
            Cloud-patched Gakumas ${{ env.GAME_VERSION }}.

            Source: ${{ env.SOURCE }}.
            Patch mode: LSPatch embedded mode using the latest Gakumas Localify app release as the module.
            Embedded patcher: Kajaqq/gaku-patcher pinned lspatch_embed.jar.

            Required app package: io.github.chinosk.gakumas.localify.
          make_latest: ${{ !inputs.prerelease }}
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ env.PATCHED_APK_NAME }}
            gkms-game-patch.json
