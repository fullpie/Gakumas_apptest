name: Game Patch Release

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Game APK source."
        required: true
        default: "manual_xapk"
        type: choice
        options:
          - manual_xapk
          - google_play
      xapk_url:
        description: "Direct .xapk URL, for manual_xapk source. Use the real download URL, not the APKPure page URL."
        required: false
        type: string
      game_version:
        description: "Game version. Required for manual_xapk; optional override for google_play."
        required: false
        type: string
      force:
        description: "Create or replace the release even when the tag already exists."
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the generated game patch release as prerelease."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  GAME_ID: "com.bandainamcoent.idolmaster_gakuen"
  APKEEP_URL: "https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu"
  APKEDITOR_URL: "https://github.com/REAndroid/APKEditor/releases/download/V1.4.9/APKEditor-1.4.9.jar"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.plan.outputs.should_build }}
      game_version: ${{ steps.plan.outputs.game_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      game_apk_name: ${{ steps.plan.outputs.game_apk_name }}
      patched_apk_name: ${{ steps.plan.outputs.patched_apk_name }}
      source: ${{ steps.plan.outputs.source }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Plan patch release
        id: plan
        env:
          INPUT_GAME_VERSION: ${{ inputs.game_version }}
          INPUT_SOURCE: ${{ inputs.source }}
          INPUT_XAPK_URL: ${{ inputs.xapk_url }}
          INPUT_FORCE: ${{ inputs.force }}
          HAS_PLAY_EMAIL: ${{ secrets.PLAY_EMAIL != '' }}
          HAS_AAS_TOKEN: ${{ secrets.AAS_TOKEN != '' }}
        run: |
          set -euo pipefail
          source="${INPUT_SOURCE:-google_play}"
          if [ "$source" != "google_play" ] && [ "$source" != "manual_xapk" ]; then
            echo "Unsupported source: $source"
            exit 1
          fi

          if [ "$source" = "google_play" ] && { [ "$HAS_PLAY_EMAIL" != "true" ] || [ "$HAS_AAS_TOKEN" != "true" ]; }; then
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "Google Play secrets are missing; skipping scheduled game patch run."
              {
                echo "should_build=false"
                echo "game_version=unknown"
                echo "release_tag=none"
                echo "game_apk_name=none"
                echo "patched_apk_name=none"
                echo "source=$source"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if [ "$source" = "manual_xapk" ]; then
            test -n "${INPUT_XAPK_URL:-}" || { echo "xapk_url is required for manual_xapk"; exit 1; }
            test -n "${INPUT_GAME_VERSION:-}" || { echo "game_version is required for manual_xapk"; exit 1; }
            game_version="$INPUT_GAME_VERSION"
          else
            game_version="$(python .github/scripts/google_play_version.py --package "$GAME_ID")"
            if [ -n "${INPUT_GAME_VERSION:-}" ]; then
              game_version="$INPUT_GAME_VERSION"
            fi
          fi

          release_tag="game-v${game_version}"
          game_apk_name="Gakumas_${game_version}_clean.apk"
          patched_apk_name="Gakumas_${game_version}_LSPatch_Manager.apk"

          should_build=true
          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null && [ "${INPUT_FORCE:-false}" != "true" ]; then
            should_build=false
          fi

          {
            echo "should_build=$should_build"
            echo "game_version=$game_version"
            echo "release_tag=$release_tag"
            echo "game_apk_name=$game_apk_name"
            echo "patched_apk_name=$patched_apk_name"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"

          echo "Source: $source"
          echo "Detected game version: $game_version"
          echo "Release tag: $release_tag"
          echo "Should build: $should_build"

  build:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.should_build == 'true'

    env:
      GAME_VERSION: ${{ needs.check.outputs.game_version }}
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      GAME_APK_NAME: ${{ needs.check.outputs.game_apk_name }}
      PATCHED_APK_NAME: ${{ needs.check.outputs.patched_apk_name }}
      SOURCE: ${{ needs.check.outputs.source }}
      XAPK_URL: ${{ inputs.xapk_url }}
      PLAY_EMAIL: ${{ secrets.PLAY_EMAIL }}
      AAS_TOKEN: ${{ secrets.AAS_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check required secrets
        if: ${{ env.SOURCE == 'google_play' }}
        run: |
          set -euo pipefail
          test -n "${PLAY_EMAIL:-}" || { echo "PLAY_EMAIL secret is required"; exit 1; }
          test -n "${AAS_TOKEN:-}" || { echo "AAS_TOKEN secret is required"; exit 1; }

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aria2 unzip

      - name: Download patch tools
        run: |
          set -euo pipefail
          aria2c -x4 "$APKEDITOR_URL" -o APKEditor.jar
          if [ "$SOURCE" = "google_play" ]; then
            aria2c -x4 "$APKEEP_URL" -o apkeep
            chmod +x apkeep
          fi
          test -f app/libs/lspatch.jar

      - name: Download Google Play split APKs
        if: ${{ env.SOURCE == 'google_play' }}
        run: |
          set -euo pipefail
          ./apkeep \
            -a "$GAME_ID" \
            -d google-play \
            -o "locale=jp,timezone=UTC+9,split_apk=1,include_additional_files=true" \
            -e "$PLAY_EMAIL" \
            -t "$AAS_TOKEN" \
            .
          find "$GAME_ID" -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Download manual XAPK
        if: ${{ env.SOURCE == 'manual_xapk' }}
        run: |
          set -euo pipefail
          test -n "${XAPK_URL:-}" || { echo "XAPK_URL is required"; exit 1; }
          rm -rf "$GAME_ID" xapk_unpack source.xapk
          aria2c -x4 "$XAPK_URL" -o source.xapk
          unzip -q source.xapk -d xapk_unpack
          python .github/scripts/prepare_xapk.py \
            --root xapk_unpack \
            --package "$GAME_ID" \
            --version "$GAME_VERSION" \
            --output "$GAME_ID"
          find "$GAME_ID" -maxdepth 2 -type f -printf "%p %s bytes\n" | sort

      - name: Merge split APKs
        run: |
          set -euo pipefail
          java -jar APKEditor.jar m -i "$GAME_ID" -o "$GAME_APK_NAME"
          unzip -t "$GAME_APK_NAME" >/dev/null

      - name: Patch merged APK
        run: |
          set -euo pipefail
          rm -rf ls_patched
          set +e
          java -jar app/libs/lspatch.jar -l 2 --manager "$GAME_APK_NAME" -o ls_patched
          lspatch_rc=$?
          set -e
          patched="$(find ls_patched -type f -name '*.apk' -print -quit || true)"
          if [ -z "$patched" ]; then
            echo "LSPatch did not produce an APK. Exit code: $lspatch_rc"
            exit "$lspatch_rc"
          fi
          if [ "$lspatch_rc" -ne 0 ]; then
            echo "::warning::LSPatch exited with $lspatch_rc but produced $patched; continuing."
          fi
          mv "$patched" "$PATCHED_APK_NAME"
          ls -lh "$PATCHED_APK_NAME"
          python - "$PATCHED_APK_NAME" <<'PY'
          import sys, zipfile

          path = sys.argv[1]
          with zipfile.ZipFile(path) as apk:
              names = set(apk.namelist())
              missing = [name for name in ("AndroidManifest.xml", "classes.dex") if name not in names]
              if missing:
                  raise SystemExit(f"Patched APK missing required entries: {', '.join(missing)}")
              print(f"Patched APK zip entries: {len(names)}")
          PY
          set +e
          unzip -t "$PATCHED_APK_NAME" >/tmp/patched-unzip-test.log 2>&1
          unzip_rc=$?
          set -e
          if [ "$unzip_rc" -ne 0 ]; then
            cat /tmp/patched-unzip-test.log
            echo "::warning::unzip -t exited with $unzip_rc for $PATCHED_APK_NAME; continuing because Python zip validation passed."
          fi

      - name: Write metadata
        run: |
          set -euo pipefail
          python .github/scripts/write_patch_metadata.py \
            --game-package "$GAME_ID" \
            --game-version "$GAME_VERSION" \
            --release-tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --asset "$PATCHED_APK_NAME" \
            --source "$SOURCE" \
            --output gkms-game-patch.json
          cat gkms-game-patch.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: Gakumas-Patched-Game-${{ env.GAME_VERSION }}
          path: |
            ${{ env.PATCHED_APK_NAME }}
            gkms-game-patch.json

      - name: Create game patch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Gakumas patched game ${{ env.GAME_VERSION }}
          body: |
            Cloud-patched Gakumas ${{ env.GAME_VERSION }}.

            Source: ${{ env.SOURCE }}.
            Patch mode: LSPatch manager mode. Translation resources are not embedded; users can still choose built-in, API, or custom ZIP language packs in Gakumas Localify.

            Required app package: io.github.chinosk.gakumas.localify.
          make_latest: false
          prerelease: ${{ inputs.prerelease || false }}
          files: |
            ${{ env.PATCHED_APK_NAME }}
            gkms-game-patch.json
