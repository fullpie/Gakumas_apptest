name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "app-v*"
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  KEYSTOREB64: ${{ secrets.KEYSTOREB64 }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Prepare Android SDK
      run: |
        set -eux
        ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        ANDROID_SDK_ROOT="$ANDROID_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
        echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

        SDKMANAGER=""
        for candidate in \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" \
          "$ANDROID_HOME/cmdline-tools/13.0/bin/sdkmanager" \
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
        do
          if [ -x "$candidate" ]; then
            SDKMANAGER="$candidate"
            break
          fi
        done

        if [ -z "$SDKMANAGER" ]; then
          echo "sdkmanager not found under $ANDROID_HOME"
          exit 1
        fi

        echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0" \
          "cmake;3.22.1" \
          "ndk;26.3.11579264"

        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" > local.properties
        echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
        python -m pip install --upgrade pip

    - name: Fetch Latest zhTW Assets
      run: |
        rm -rf app/src/main/assets/gakumas-local
        mkdir -p app/src/main/assets/gakumas-local

        RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/fullpie/GakumasTranslationData/releases/latest)
        ZIP_URL=$(printf '%s' "$RELEASE_JSON" | python -c "import json,sys; data=json.load(sys.stdin); print(next(asset['browser_download_url'] for asset in data['assets'] if asset['name'].endswith('.zip')))")
        RELEASE_TAG=$(printf '%s' "$RELEASE_JSON" | python -c "import json,sys; data=json.load(sys.stdin); print(data['tag_name'])")

        curl -fL "$ZIP_URL" -o "$RUNNER_TEMP/gakumas_zhtw.zip"
        unzip -q "$RUNNER_TEMP/gakumas_zhtw.zip" -d app/src/main/assets/gakumas-local
        printf '%s' "$RELEASE_TAG" > app/src/main/assets/gakumas-local/version.txt
        test -f app/src/main/assets/gakumas-local/version.txt
        test -d app/src/main/assets/gakumas-local/local-files/resource
              
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - uses: actions/upload-artifact@v6
      id: upload_unsigned
      with:
        name: GakumasLocalify-Unsigned-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Sign app APK
      if: ${{ env.KEYSTOREB64 != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_PASSWORD != '' }}
      id: sign_app
      run: |
        set -euo pipefail
        keystore="$RUNNER_TEMP/gkms-upload.p12"
        signed_apk="$RUNNER_TEMP/GakumasLocalify-signed.apk"
        printf '%s' "$KEYSTOREB64" | base64 -d > "$keystore"
        apksigner sign \
          --ks "$keystore" \
          --ks-type PKCS12 \
          --ks-key-alias "$ANDROID_KEY_ALIAS" \
          --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
          --key-pass "pass:$ANDROID_KEY_PASSWORD" \
          --out "$signed_apk" \
          app/build/outputs/apk/debug/app-debug.apk
        apksigner verify --verbose "$signed_apk"
        echo "signedReleaseFile=$signed_apk" >> "$GITHUB_OUTPUT"

    - uses: actions/upload-artifact@v6
      if: ${{ steps.sign_app.outputs.signedReleaseFile != '' }}
      id: upload_signed
      with:
        name: GakumasLocalify-Signed-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}

    - name: Prepare app release assets
      if: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
      env:
        SIGNED_APK: ${{ steps.sign_app.outputs.signedReleaseFile }}
      run: |
        set -euo pipefail
        release_apk="GakumasLocalify-${GITHUB_REF_NAME}.apk"
        source_apk="${SIGNED_APK:-}"
        signed=true
        if [ -z "$source_apk" ]; then
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          signed=false
        fi
        test -f "$source_apk"
        cp "$source_apk" "$release_apk"
        export signed
        python - <<'PY'
        import hashlib
        import json
        import os
        from datetime import datetime, timezone

        tag = os.environ["GITHUB_REF_NAME"]
        repo = os.environ["GITHUB_REPOSITORY"]
        apk = f"GakumasLocalify-{tag}.apk"
        with open(apk, "rb") as handle:
            digest = hashlib.file_digest(handle, "sha256").hexdigest()
        data = {
            "schemaVersion": 1,
            "kind": "gakumas-localify-app",
            "createdAt": datetime.now(timezone.utc).isoformat(),
            "releaseTag": tag,
            "versionName": tag.removeprefix("app-"),
            "packageName": "io.github.chinosk.gakumas.localify",
            "signed": os.environ.get("signed", "false") == "true",
            "assets": [
                {
                    "name": apk,
                    "browserDownloadUrl": f"https://github.com/{repo}/releases/download/{tag}/{apk}",
                    "sha256": digest,
                    "size": os.path.getsize(apk),
                    "contentType": "application/vnd.android.package-archive",
                }
            ],
        }
        with open("gkms-app-update.json", "w", encoding="utf-8") as handle:
            json.dump(data, handle, ensure_ascii=False, indent=2)
            handle.write("\n")
        PY

    - name: Create app release
      if: ${{ startsWith(github.ref, 'refs/tags/app-v') }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Gakumas Localify ${{ github.ref_name }}
        body: |
          Gakumas Localify Android APK.

          This release channel is used by the in-app updater. Game patch releases use the separate `game-v...` tag prefix.
          If signing secrets are not configured, this release falls back to the debug APK and may require uninstalling the previous app before install.
        make_latest: false
        files: |
          GakumasLocalify-${{ github.ref_name }}.apk
          gkms-app-update.json
