name: Android CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Setup Android Development Environment
      uses: android-actions/setup-android@v3

    - name: install dependencies
      run: |
        sdkmanager --install "cmake;3.22.1"
        echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" > local.properties
        echo "$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
        python -m pip install --upgrade pip

    - name: Fetch Latest zhTW Assets
      run: |
        rm -rf app/src/main/assets/gakumas-local
        mkdir -p app/src/main/assets/gakumas-local

        RELEASE_JSON=$(curl -fsSL https://api.github.com/repos/fullpie/GakumasTranslationData/releases/latest)
        ZIP_URL=$(printf '%s' "$RELEASE_JSON" | python -c "import json,sys; data=json.load(sys.stdin); print(next(asset['browser_download_url'] for asset in data['assets'] if asset['name'].endswith('.zip')))")
        RELEASE_TAG=$(printf '%s' "$RELEASE_JSON" | python -c "import json,sys; data=json.load(sys.stdin); print(data['tag_name'])")

        curl -fL "$ZIP_URL" -o "$RUNNER_TEMP/gakumas_zhtw.zip"
        unzip -q "$RUNNER_TEMP/gakumas_zhtw.zip" -d app/src/main/assets/gakumas-local
        printf '%s' "$RELEASE_TAG" > app/src/main/assets/gakumas-local/version.txt
              
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - uses: actions/upload-artifact@v4
      id: upload_unsigned
      with:
        name: GakumasLocalify-Unsigned-apk
        path: app/build/outputs/apk/debug/app-debug.apk
      continue-on-error: true

    - uses: r0adkll/sign-android-release@v1
      name: Sign app APK
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/debug
        signingKeyBase64: ${{ secrets.KEYSTOREB64 }}
        alias: ${{ secrets.ANDROID_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      continue-on-error: true

    - uses: actions/upload-artifact@v4
      id: upload_signed
      with:
        name: GakumasLocalify-Signed-apk
        path: ${{steps.sign_app.outputs.signedReleaseFile}}
      continue-on-error: true
